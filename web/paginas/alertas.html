<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas de Residuos — TrashFlow</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Historial completo y filtros de alertas de residuos por IA en la Municipalidad de Vicente López.">
  
  <!-- CSS Imports -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="icon" type="image/png" href="../assets/isotipo.png">
  <link rel="stylesheet" href="../css/alertas.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar Navigation (dynamically rendered by JS) -->
    <aside class="sidebar"></aside>
    
    <!-- Main Content Container -->
    <main class="main-content">
      
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title" id="topbar-title">Alertas de Residuos</h1>
          <div class="topbar-subtitle">
            <span id="topbar-subtitle">📍 Municipalidad de Vicente López</span>
          </div>
        </div>
        
        <div class="topbar-right">
          <!-- Notification Bell -->
          <div class="notification-bell" title="Alertas pendientes">
            <svg viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          
          <!-- Profile Initials Icon -->
          <div class="user-profile">
            <div class="user-avatar" title="Cargando...">--</div>
          </div>
        </div>
      </header>
      
      <!-- Scroll Content Body -->
      <div class="content-body">

        <!-- Camera Context Banner (shown only when filtering by a specific camera) -->
        <div id="camara-context-banner" class="camara-context-banner hidden">
          <div class="camara-context-banner-inner">
            <div class="camara-context-info">
              <span class="camara-context-icon">📷</span>
              <div>
                <div class="camara-context-label">Filtrando alertas de la cámara</div>
                <div class="camara-context-name" id="camara-context-name">—</div>
              </div>
            </div>
            <a href="alertas.html" class="camara-context-clear" title="Ver todas las alertas">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Ver todas las alertas
            </a>
          </div>
        </div>

        <!-- Filter Panel Section -->
        <section class="card filter-card">
          <form id="filters-form" class="filter-grid">
            <!-- Hidden field to persist camara_id across filter submissions -->
            <input type="hidden" id="filter-camara-id" name="camara_id" value="">
            
            <!-- Search Text -->
            <div class="form-group search-group">
              <label for="search-input" class="form-label">Buscar Alerta</label>
              <div class="input-container">
                <input 
                  type="text" 
                  id="search-input" 
                  class="form-input" 
                  placeholder="Dirección..."
                >
              </div>
            </div>
            
            <!-- Filter Zona -->
            <div class="form-group">
              <label for="filter-zona" class="form-label">Zona</label>
              <select id="filter-zona" class="form-select">
                <option value="Todas las Zonas">Todas las Zonas</option>
                <option value="Centro">Centro</option>
                <option value="Olivos">Olivos</option>
                <option value="La Lucila">La Lucila</option>
                <option value="Munro">Munro</option>
                <option value="Villa Martelli">Villa Martelli</option>
                <option value="Florida">Florida</option>
                <option value="Carapachay">Carapachay</option>
              </select>
            </div>
            
            <!-- Filter Estado -->
            <div class="form-group">
              <label for="filter-estado" class="form-label">Estado</label>
              <select id="filter-estado" class="form-select">
                <option value="Todos los Estados">Todos los Estados</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Asignada">Asignada</option>
                <option value="En Proceso">En Proceso</option>
                <option value="Resuelta">Resuelta</option>
                <option value="Descartada">Descartada</option>
              </select>
            </div>
            
            <!-- Datepicker Picker -->
            <div class="form-group">
              <label for="filter-fecha" class="form-label">Fecha</label>
              <input type="date" id="filter-fecha" class="form-input date-input">
            </div>
            
            <!-- Submit Button -->
            <div class="form-group submit-group">
              <label class="form-label select-hidden-label">&nbsp;</label>
              <button type="submit" class="btn btn-primary filter-submit-btn">
                Aplicar Filtros
              </button>
            </div>
            
          </form>
        </section>
        
        <!-- Table Alert Log Section -->
        <section class="card table-card">
          <div class="table-responsive">
            <table class="table" id="alerts-table">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Zona / Ubicación</th>
                  <th>Tipo</th>
                  <th>Estado</th>
                  <th>Fecha / Hora</th>
                  <th>Operador</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- Loader skeletons by default -->
                <tr class="skeleton-row"></tr>
                <tr class="skeleton-row"></tr>
                <tr class="skeleton-row"></tr>
                <tr class="skeleton-row"></tr>
                <tr class="skeleton-row"></tr>
              </tbody>
            </table>
          </div>
          
          <!-- Pagination Toolbar -->
          <div class="pagination-container">
            <div class="pagination-summary" id="pagination-info">
              Cargando alertas...
            </div>
            <div class="pagination-buttons" id="pagination-controls">
              <!-- Dynamically populated page buttons -->
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Zoom Photo Modal overlay -->
  <div id="photo-modal" class="modal-overlay">
    <div class="modal-container">
      <button class="modal-close-btn" id="modal-photo-close" aria-label="Cerrar modal">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body">
        <img src="" id="modal-photo-img" class="modal-img" alt="Evidencia ampliada">
        <div class="modal-title-bar">
          <span id="modal-photo-title" style="font-weight: 600; color: var(--color-text-primary);">Evidencia de Alerta</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Asignar Operador Modal overlay -->
  <div id="asignar-operador-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 400px; width: 90%;">
      <button class="modal-close-btn" id="modal-asignar-close" aria-label="Cerrar modal">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-body" style="padding: 25px;">
        <h3 style="margin-top: 0; color: var(--color-text-primary); font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">Asignar Operador</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: 20px;">Selecciona el operador de campo que resolverá esta alerta.</p>
        
        <input type="hidden" id="asignar-alerta-id">
        
        <div style="margin-bottom: 20px;">
          <label for="select-operador" style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--color-text-primary); font-size: 0.9rem;">Operador Activo</label>
          <select id="select-operador" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-primary); outline: none;">
            <option value="">Cargando operadores...</option>
          </select>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
          <button type="button" class="btn btn-secondary" id="btn-cancelar-asignar" style="padding: 8px 16px;">Cancelar</button>
          <button type="button" class="btn" id="btn-confirmar-asignar" disabled>Confirmar asignación</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Core Imports -->
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/alertas.js"></script>
</body>
</html>
