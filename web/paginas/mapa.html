<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo — TrashFlow</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Visualización geoespacial en tiempo real de las alertas de residuos por IA en Vicente López.">
  
  <!-- CSS Leaflet & MarkerCluster CDNs -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">

  <link rel="icon" type="image/png" href="../assets/isotipo.png">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/mapa.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar Navigation (dynamically rendered by JS) -->
    <aside class="sidebar"></aside>
    
    <!-- Main Content Container -->
    <main class="main-content">
      
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title">Mapa Interactivo</h1>
          <div class="topbar-subtitle">
            <span>📍 Monitoreo de Residuos en Vicente López</span>
          </div>
        </div>
      </header>
      
      <!-- Map Area and Floating Filters -->
      <div class="map-view-container">
        <!-- Leaflet Map Container -->
        <div id="map"></div>
        
        <!-- Floating Filter Panel -->
        <div class="filters-panel" id="filters-panel">
          <div class="filters-header">
            <h3>Filtros de Alertas</h3>
            <button class="toggle-filters-btn" id="toggle-filters-btn" title="Colapsar panel">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
          
          <div class="filters-body">
            <div class="filter-group">
              <label class="filter-group-title">Estados</label>
              <div class="checkbox-list">
                <label class="checkbox-item">
                  <input type="checkbox" value="pendiente" checked class="filter-status">
                  <span class="checkbox-custom"></span>
                  <span class="checkbox-label">Pendiente</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" value="alertada" checked class="filter-status">
                  <span class="checkbox-custom"></span>
                  <span class="checkbox-label">Alertada</span>
                </label>
                <label class="checkbox-item">
                  <input type="checkbox" value="resuelta" checked class="filter-status">
                  <span class="checkbox-custom"></span>
                  <span class="checkbox-label">Resuelta</span>
                </label>
              </div>
            </div>
            
            <div class="filter-group">
              <label for="filter-zona" class="filter-group-title">Zona</label>
              <select id="filter-zona" class="form-select">
                <option value="todas">Todas las Zonas</option>
                <option value="1">Zona 1 - Centro</option>
                <option value="2">Zona 2 - Olivos</option>
                <option value="3">Zona 3 - La Lucila</option>
                <option value="4">Zona 4 - Munro</option>
                <option value="5">Zona 5 - Villa Martelli</option>
                <option value="6">Zona 6 - Florida</option>
                <option value="7">Zona 7 - Carapachay</option>
              </select>
            </div>

            <div class="filter-group">
              <label class="filter-group-title">Colores por Zona</label>
              <div class="zone-legend-grid">
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #EF4444;"></span>Centro</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #F5A623;"></span>Olivos</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #3B82F6;"></span>La Lucila</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #10B981;"></span>Munro</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #8B5CF6;"></span>V. Martelli</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #EC4899;"></span>Florida</div>
                <div class="zone-legend-pill"><span class="zone-pill-dot" style="background-color: #F97316;"></span>Carapachay</div>
              </div>
            </div>
          </div>
          
          <div class="filters-footer">
            <span class="counter-text" id="visible-counter">0 alertas visibles</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Leaflet & MarkerCluster Script CDNs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <!-- Script Core Imports -->
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/mapa.js"></script>
</body>
</html>
