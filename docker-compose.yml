services:
  trashflow-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: trashflow-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./api/static/fotos/detecciones:/app/api/static/fotos/detecciones
    networks:
      - proxy-network

  trashflow-web:
    image: nginx:alpine
    container_name: trashflow-web
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
